[project]
name = "dhk-skill-doctor"
version = "1.0.0"
description = "Repo-free, one-shot installer for the skill-doctor Claude Agent Skill"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "dhk", email = "dhkonskills@dhk.io" }]
requires-python = ">=3.9"
keywords = ["claude", "agent-skills", "claude-code"]

[project.urls]
Homepage = "https://github.com/dhk/skill-map"
Repository = "https://github.com/dhk/skill-map"
Documentation = "https://github.com/dhk/skill-map/blob/main/SKILL-DOCTOR.md"

[project.scripts]
dhk-skill-doctor = "skill_doctor_installer.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/skill_doctor_installer"]

[tool.hatch.build.targets.wheel.force-include]
"skills/skill-doctor" = "skill_doctor_installer/_bundled"
